<p-toast></p-toast>
<div class="flex justify-content-center card surface-0 shadow-1">
    <form autocomplete="off" [formGroup]="formularioRegistro" class="flex justify-content-center  flex-column"
        (ngSubmit)="register()">

        <h1 class="flex justify-content-center text-bold">Formulario de Registro</h1>
        <div class="mb-1" *ngIf="usuario.rol=='SuperAdministrador'">
            <!-- <div class="mb-1"> -->
            <label for="colegio" class="">COLEGIO <i class="pi pi-star text-pink-700 text-xs"></i></label>
            <app-select-colegio [colegioIdInput]="formularioRegistro.get('colegioId')?.value" (colegioId)="recibirColegioId($event)"></app-select-colegio>
        </div>
        <div class="mb-1" *ngIf="usuario.rol=='SuperAdministrador'||usuario.rol=='Administrador'">
        <app-select-rol [rolIdInput]="formularioRegistro.get('rolId')?.value" (rolId)="recibirRolId($event)"></app-select-rol>
        </div>
        <div class="p-inputgroup mb-1" *ngIf="usuario.rol=='SuperAdministrador'||usuario.rol=='Administrador'">
            <span class="p-inputgroup-addon"><i class="pi pi-envelope"></i></span>
            <input formControlName="email" type="email" placeholder="Correo Electrónico" pInputText />
        </div>
        <div class="p-inputgroup mb-1">
            <span class="p-inputgroup-addon"><i class="pi pi-user"></i></span>
            <input formControlName="run" type="text" placeholder="RUN o Nombre de Usuario" pInputText />
        </div>
        
        <div class="p-inputgroup" *ngIf="campoNoEsValido('run')">
            <span class="text-pink-700">Nombre de usuario es obligatorio!!!.</span>
        </div>
        
        <div class="p-inputgroup mb-1">
            <span class="p-inputgroup-addon"><i class="pi pi-key"></i></span>
            <input formControlName="password" type="password" pInputText placeholder="Contraseña">
        </div>
        <div class="p-inputgroup" *ngIf="campoNoEsValido('password')">
            <span class="text-pink-700">La contraseña debe tener al menos 4 caracteres!!!.</span>
        </div>
        <div class="p-inputgroup mb-1">
            <span class="p-inputgroup-addon"><i class="pi pi-key"></i></span>
            <input formControlName="confirmPassword" type="password" pInputText placeholder="Repetir Contraseña">
        </div>
        <div class="p-inputgroup mb-3" *ngIf="campoNoEsIgual('confirmPassword')">
            <span class="text-pink-700">La contraseña y Repetir contraseña no son iguales.</span>
        </div>

        <div *ngIf="cargando" class="flex justify-content-center align-items-center">
            <p-progressSpinner [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8"
                fill="#EEEEEE" animationDuration=".5s"></p-progressSpinner>
            <span [ngStyle]="{color: 'var(--bluegray-500)'}">Validando registro, espere!...</span>
        </div>
        <button pButton pRipple label="Registrar Usuario"
            class="p-button-raised p-button-primary p-button-rounded mb-3 mt-3" type="submit">
        </button>
        <button pButton pRipple type="button" routerLink='/inicio' label="Volver a Inicio"
            class="p-button-sm p-button-secondary mb-3">
        </button>
    </form>
</div>
