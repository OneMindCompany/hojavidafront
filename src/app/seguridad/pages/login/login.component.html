<p-toast></p-toast>
<div class="flex justify-content-center container ">
    <form autocomplete="off" [formGroup]="formulario" class="flex justify-content-center flex-column" (ngSubmit)="login()">
        <img  src="../../../../assets/global-image/logoBlanco.png" alt="" >
        <h1 class="flex justify-content-center text-bold">Iniciar Sesión</h1>
        
        <div class="p-inputgroup mb-1" >
            <span class="p-inputgroup-addon"><i class="pi pi-user"></i></span>
            <input formControlName="Run" type="text"  placeholder="Nombre de Usuario" pInputText />
        </div>
        
        <div class="p-inputgroup mb-1">
            <span class="p-inputgroup-addon"><i class="pi pi-key"></i></span>
            <input formControlName="Password" type="password" pInputText placeholder="Contraseña">
        </div>
        
        <div *ngIf="cargando" class="flex justify-content-center align-items-center">
            <p-progressSpinner  [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8" fill="#EEEEEE" animationDuration=".5s"></p-progressSpinner>
            <span [ngStyle]="{color: 'var(--bluegray-50)'}">Iniciando Sesión, espere!...</span>  
        </div>
        
        <button pButton pRipple label="Ingresar" class="p-button-raised p-button-primary p-button-rounded mt-3 mb-3" type="submit"
            [disabled]="formulario.invalid"></button>
      
        <div class="mb-3">
            <button pButton pRipple type="button" routerLink='/inicio/register'  label="Recuperar Contraseña" class="mr-2 p-button-sm p-button-secondary"></button>
            <button pButton pRipple type="button" routerLink='/inicio'  label="Volver a Inicio" class="p-button-sm p-button-secondary"></button>
        </div>
    </form>
</div>
