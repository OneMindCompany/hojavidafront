<div class="grid justify-content-center mt-3 mb-1">
    <a href="">
        <p-avatar image="../../../assets/global-image/logo256.png" Class="mr-2" size="xlarge"></p-avatar>
    </a>
</div>

<div *ngIf="cargando" class="flex justify-content-center align-items-center">
    <p-progressSpinner [style]="{width: '50px', height: '50px'}" styleClass="custom-spinner" strokeWidth="8"
        fill="#EEEEEE" animationDuration=".5s"></p-progressSpinner>
    <span [ngStyle]="{color: 'var(--bluegray-500)'}">Generando Ficha de Matrícula, Espere!...</span>
</div>
<p-panelMenu [model]="items"></p-panelMenu>
