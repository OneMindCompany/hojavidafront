<form [formGroup]="form">
    <p-autoComplete formControlName="tenenciaDeVivienda" [suggestions]="tenenciaDeViviendasFiltrados"
        (completeMethod)="filtrarTenenciaDeVivienda($event)" field="nombre" [dropdown]="true" styleClass="w-full">
        <ng-template let-tenenciaDeVivienda pTemplate="item">
            <div class="tenenciaDeVivienda-item">
                <div>{{tenenciaDeVivienda.nombre}}</div>
            </div>
        </ng-template>
    </p-autoComplete>
</form>
<span d-error-msg mensaje="Debe seleccionar una Tenencia De Vivienda" *ngIf="campoNoEsValido('tenenciaDeVivienda')"></span>
